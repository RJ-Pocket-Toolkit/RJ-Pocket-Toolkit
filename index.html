<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RJ Pocket Toolkit</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#e2e8f0;--dark:#111827;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}
header{background:var(--dark);color:#fff;padding:20px 16px;text-align:center}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
.container{max-width:1180px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:14px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.nav button.active{background:var(--dark);color:#fff}
.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0f172a0a}
h2{margin:0 0 16px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d7dee8;border-radius:9px;padding:11px;background:#fff;font-size:14px;outline:none}textarea{min-height:80px}
button.primary,.btn{border:0;border-radius:9px;background:var(--dark);color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.btn.light{background:#e9eef5;color:#172033}.btn.red{background:#dc2626}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.items{overflow-x:auto}.item{display:grid;grid-template-columns:2.3fr .7fr 1fr 1fr 42px;gap:7px;min-width:720px;margin:7px 0}.item.head{font-size:11px;font-weight:800;color:#64748b}
.invoice{background:#fff;border:1px solid #cfd8e3;max-width:900px;margin:18px auto 0;padding:35px;box-shadow:0 5px 20px #0000000b}
.inv-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111827;padding-bottom:18px}.brand{font-size:25px;font-weight:900}.small{font-size:12px;color:#64748b;line-height:1.6}.right{text-align:right}.invoice h3{margin:0 0 8px;font-size:25px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:22px 0}.label{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:800;margin-bottom:5px}
.inv-table{width:100%;border-collapse:collapse}.inv-table th{background:#f1f5f9;font-size:11px;text-transform:uppercase}.inv-table th,.inv-table td{padding:9px;border-bottom:1px solid #e2e8f0;font-size:12px}.num{text-align:right}
.summary{width:330px;margin:18px 0 0 auto}.sumrow{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.total{border-top:2px solid #111827;font-size:18px;font-weight:900;padding-top:10px}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#e2e8f0;font-size:10px;font-weight:900}.footer-note{border-top:1px solid #e2e8f0;margin-top:35px;padding-top:12px;font-size:11px;color:#64748b}.signbox{text-align:right;margin-top:35px;min-height:85px}.signimg{max-width:170px;max-height:70px;object-fit:contain;display:inline-block}.signline{border-top:1px solid #111827;width:180px;margin:5px 0 0 auto}
.result{margin-top:12px;background:#f1f5f9;border-radius:10px;padding:13px;font-weight:700;word-break:break-word}
@media(max-width:700px){.container{padding:10px}.grid,.grid3,.parties{grid-template-columns:1fr}.invoice{padding:18px}.inv-head{flex-direction:column}.right{text-align:left}.summary{width:100%}}
@media print{body{background:#fff}.no-print,header,.nav,.toolcard{display:none!important}.panel#invoicePanel{display:block!important}.invoice{border:0;box-shadow:none;max-width:none;margin:0;padding:8mm}}
</style>
</head>
<body>
<header><h1>RJ Pocket Toolkit</h1><p>Professional everyday tools in one website</p></header>
<div class="container">
<div class="nav no-print" id="nav"></div>

<section class="panel active" id="invoicePanel">
<div class="card toolcard">
<h2>Professional Invoice</h2>
<div class="grid" style="margin-bottom:14px">
<div><label>🖼️ Business Logo</label><input id="logoUpload" type="file" accept="image/*" onchange="loadImage(this,'logoData')"><input id="logoData" type="hidden" value="assets/rj-tech-logo.png"></div>
<div><label>✍️ Authorized Signature</label><input id="signatureUpload" type="file" accept="image/*" onchange="loadImage(this,'signatureData')"><input id="signatureData" type="hidden"></div>
</div>
<div class="grid">
<div><label>Business Name</label><input id="company" value="RJ TECH Solutions"></div>
<div><label>Invoice No.</label><input id="invoiceNo"></div>
<div><label>Business Address</label><input id="companyAddress" value="Pune, Maharashtra"></div>
<div><label>Invoice Date</label><input id="invoiceDate" type="date"></div>
<div><label>Phone</label><input id="companyPhone" placeholder="Phone number"></div>
<div><label>Email</label><input id="companyEmail" placeholder="Email"></div>
<div><label>GSTIN</label><input id="companyGSTIN" placeholder="Optional"></div>
<div><label>Payment Status</label><select id="status"><option>PAID</option><option>PENDING</option><option>PARTIALLY PAID</option></select></div>
</div>
<hr style="border:0;border-top:1px solid #e2e8f0;margin:20px 0">
<div class="grid">
<div><label>Bill To - Customer Name</label><input id="customer" placeholder="Customer / Company"></div>
<div><label>Customer Phone</label><input id="customerPhone"></div>
<div><label>Customer Address</label><input id="customerAddress"></div>
<div><label>Customer GSTIN</label><input id="customerGSTIN"></div>
</div>
<div class="items" style="margin-top:18px">
<div class="item head"><span>Description</span><span>Qty</span><span>Rate</span><span>Amount</span><span></span></div>
<div id="items"></div>
</div>
<div class="actions no-print"><button class="btn light" onclick="addItem()">＋ Add Item</button></div>
<div class="grid3" style="margin-top:14px">
<div><label>Discount (₹)</label><input id="discount" type="number" value="0" min="0" oninput="updateInvoicePreview()"></div>
<div><label>GST (%)</label><input id="tax" type="number" value="18" min="0" oninput="updateInvoicePreview()"></div>
<div><label>Tax Type</label><select id="taxType" onchange="renderInvoice()"><option value="gst">GST (single)</option><option value="split">CGST + SGST</option><option value="igst">IGST</option></select></div>
</div>
<div style="margin-top:12px"><label>Notes / Terms</label><textarea id="notes" placeholder="Thank you for your business."></textarea></div>
<div class="actions no-print"><button class="primary" onclick="renderInvoice()">Update Invoice</button><button class="btn" onclick="window.print()">🖨 Print / Save PDF</button><button class="btn light" onclick="downloadInvoice()">⬇ Download HTML</button></div>
</div>
<div class="invoice" id="invoice"></div>
</section>

<section class="panel" id="gstPanel"><div class="card"><h2>GST Calculator</h2><div class="grid"><div><label>Amount</label><input id="gstAmount" type="number" value="1000"></div><div><label>GST %</label><input id="gstRate" type="number" value="18"></div></div><button class="btn" onclick="gstCalc()">Calculate</button><div class="result" id="gstResult"></div></div></section>
<section class="panel" id="percentPanel"><div class="card"><h2>Percentage Calculator</h2><div class="grid"><div><label>Value</label><input id="percentValue" type="number"></div><div><label>Percentage</label><input id="percentRate" type="number"></div></div><button class="btn" onclick="percentCalc()">Calculate</button><div class="result" id="percentResult"></div></div></section>
<section class="panel" id="agePanel"><div class="card"><h2>Age Calculator</h2><label>Date of Birth</label><input id="birth" type="date"><button class="btn" onclick="ageCalc()">Calculate</button><div class="result" id="ageResult"></div></div></section>
<section class="panel" id="datePanel"><div class="card"><h2>Date Difference</h2><div class="grid"><div><label>Start Date</label><input id="date1" type="date"></div><div><label>End Date</label><input id="date2" type="date"></div></div><button class="btn" onclick="dateCalc()">Calculate</button><div class="result" id="dateResult"></div></div></section>
<section class="panel" id="unitPanel"><div class="card"><h2>Unit Converter</h2><div class="grid"><div><label>Value</label><input id="unitValue" type="number" value="1"></div><div><label>Conversion</label><select id="unitType"><option value="kmmi">KM → Miles</option><option value="mikm">Miles → KM</option><option value="kgp">KG → Pound</option><option value="pkg">Pound → KG</option><option value="cf">°C → °F</option><option value="fc">°F → °C</option><option value="mft">Metre → Feet</option><option value="ftm">Feet → Metre</option></select></div></div><button class="btn" onclick="unitCalc()">Convert</button><div class="result" id="unitResult"></div></div></section>
<section class="panel" id="passwordPanel"><div class="card"><h2>Password Generator</h2><div class="grid"><div><label>Length</label><input id="passLength" type="number" value="16" min="4" max="100"></div><div><label>Symbols</label><select id="symbols"><option>Yes</option><option>No</option></select></div></div><button class="btn" onclick="passwordCalc()">Generate</button><div class="result" id="passResult"></div></div></section>
<section class="panel" id="textPanel"><div class="card"><h2>Text Tools</h2><textarea id="textInput" placeholder="Paste your text..."></textarea><div class="actions"><button class="btn" onclick="textTool('upper')">UPPER</button><button class="btn" onclick="textTool('lower')">lower</button><button class="btn" onclick="textTool('title')">Title Case</button><button class="btn light" onclick="textTool('clean')">Clean Spaces</button></div><div class="result" id="textResult"></div></div></section>
<section class="panel" id="numberPanel"><div class="card"><h2>Number → Words</h2><input id="numberInput" type="number" value="12500"><button class="btn" onclick="wordsCalc()">Convert</button><div class="result" id="numberResult"></div></div></section>
<section class="panel" id="storagePanel"><div class="card"><h2>Storage Converter</h2><div class="grid"><div><label>Value</label><input id="storageValue" type="number" value="1"></div><div><label>From</label><select id="storageUnit"><option>KB</option><option>MB</option><option>GB</option><option>TB</option></select></div></div><button class="btn" onclick="storageCalc()">Convert</button><div class="result" id="storageResult"></div></div></section>
<section class="panel" id="randomPanel"><div class="card"><h2>Random Number</h2><div class="grid"><div><label>Minimum</label><input id="randomMin" type="number" value="1"></div><div><label>Maximum</label><input id="randomMax" type="number" value="100"></div></div><button class="btn" onclick="randomCalc()">Generate</button><div class="result" id="randomResult"></div></div></section>
<section class="panel" id="whatsappPanel"><div class="card"><h2>WhatsApp Message</h2><label>Phone with country code</label><input id="waPhone" placeholder="919876543210"><label style="margin-top:10px">Message</label><textarea id="waMessage"></textarea><button class="btn" onclick="openWA()">Open WhatsApp</button></div></section>
</div>

<script>
const navItems=[['invoicePanel','🧾 Invoice'],['gstPanel','GST'],['percentPanel','% Percentage'],['agePanel','Age'],['datePanel','Date Diff'],['unitPanel','Units'],['passwordPanel','Password'],['textPanel','Text Tools'],['numberPanel','Number Words'],['storagePanel','Storage'],['randomPanel','Random'],['whatsappPanel','WhatsApp']];
const nav=document.getElementById('nav');navItems.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x[1];if(i===0)b.className='active';b.onclick=()=>{document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(x[0]).classList.add('active');nav.querySelectorAll('button').forEach(q=>q.classList.remove('active'));b.classList.add('active')};nav.appendChild(b)});
let rows=[{d:'Computer Service',q:1,r:1000}];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function money(n){return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function addItem(){rows.push({d:'',q:1,r:0});renderRows();updateInvoicePreview()}
function delItem(i){rows.splice(i,1);if(!rows.length)rows.push({d:'',q:1,r:0});renderRows();updateInvoicePreview()}
function renderRows(){$('items').innerHTML=rows.map((x,i)=>`<div class="item"><input value="${esc(x.d)}" placeholder="Item / Service" oninput="rows[${i}].d=this.value;updateInvoicePreview()"><input type="number" min="0" value="${x.q}" oninput="rows[${i}].q=+this.value;updateInvoicePreview()"><input type="number" min="0" value="${x.r}" oninput="rows[${i}].r=+this.value;updateInvoicePreview()"><input readonly value="${money(x.q*x.r)}"><button class="btn red" onclick="delItem(${i})">×</button></div>`).join('')}
function updateInvoicePreview(){
  const sub=rows.reduce((s,x)=>s+(+x.q||0)*(+x.r||0),0);
  const disc=Math.min(sub,+$('discount').value||0);
  const taxable=sub-disc;
  const taxRate=+$('tax').value||0;
  const tax=taxable*taxRate/100;
  const type=$('taxType').value;
  let taxHTML=type==='split'
    ? `<div class="sumrow"><span>CGST (${money(taxRate/2)}%)</span><b>₹${money(tax/2)}</b></div><div class="sumrow"><span>SGST (${money(taxRate/2)}%)</span><b>₹${money(tax/2)}</b></div>`
    : type==='igst'
    ? `<div class="sumrow"><span>IGST (${money(taxRate)}%)</span><b>₹${money(tax)}</b></div>`
    : `<div class="sumrow"><span>GST (${money(taxRate)}%)</span><b>₹${money(tax)}</b></div>`;
  const total=taxable+tax;
  const trs=rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.d)||'-'}</td><td class="num">${x.q}</td><td class="num">₹${money(x.r)}</td><td class="num">₹${money(x.q*x.r)}</td></tr>`).join('');
  $('invoice').innerHTML=`<div class="inv-head"><div>${$('logoData').value?`<img class="signimg" style="display:block;max-width:150px;max-height:65px;margin-bottom:8px" src="${$('logoData').value}">`:``}<div class="brand">${esc($('company').value)||'Business Name'}</div><div class="small">${esc($('companyAddress').value)}<br>${esc($('companyPhone').value)}<br>${esc($('companyEmail').value)}<br>${$('companyGSTIN').value?'GSTIN: '+esc($('companyGSTIN').value):''}</div></div><div class="right"><h3>INVOICE</h3><b>${esc($('invoiceNo').value)}</b><div class="small">${$('invoiceDate').value}</div><span class="badge">${$('status').value}</span></div></div>
  <div class="parties"><div><div class="label">Bill To</div><b>${esc($('customer').value)||'Customer Name'}</b><div class="small">${esc($('customerAddress').value)}<br>${esc($('customerPhone').value)}<br>${$('customerGSTIN').value?'GSTIN: '+esc($('customerGSTIN').value):''}</div></div><div><div class="label">Payment</div><b>${$('status').value}</b><div class="small">Invoice No: ${esc($('invoiceNo').value)}<br>Date: ${$('invoiceDate').value}</div></div></div>
  <table class="inv-table"><thead><tr><th>#</th><th>Description</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>${trs}</tbody></table>
  <div class="summary"><div class="sumrow"><span>Subtotal</span><b>₹${money(sub)}</b></div><div class="sumrow"><span>Discount</span><b>- ₹${money(disc)}</b></div><div class="sumrow"><span>Taxable Amount</span><b>₹${money(taxable)}</b></div>${taxHTML}<div class="sumrow total"><span>Grand Total</span><b>₹${money(total)}</b></div></div>
  <div class="footer-note"><b>Notes / Terms</b><br>${esc($('notes').value)||'Thank you for your business.'}<br><br>This invoice is computer generated.</div>
<div class="signbox">${$('signatureData').value?`<img class="signimg" src="${$('signatureData').value}"><div class="signline"></div>`:`<div style="height:65px"></div><div class="signline"></div>`}<b>Authorized Signature</b></div>`;
}
function loadImage(input,targetId){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('Please select an image file.');input.value='';return}
  const reader=new FileReader();
  reader.onload=e=>{ $(targetId).value=e.target.result; updateInvoicePreview(); };
  reader.readAsDataURL(file);
}
function renderInvoice(){
renderRows();let sub=rows.reduce((s,x)=>s+(+x.q||0)*(+x.r||0),0),disc=Math.min(sub,+$('discount').value||0),taxable=sub-disc,taxRate=+$('tax').value||0,tax=taxable*taxRate/100,type=$('taxType').value;
let taxHTML=type==='split'?`<div class="sumrow"><span>CGST (${money(taxRate/2)}%)</span><b>₹${money(tax/2)}</b></div><div class="sumrow"><span>SGST (${money(taxRate/2)}%)</span><b>₹${money(tax/2)}</b></div>`:type==='igst'?`<div class="sumrow"><span>IGST (${money(taxRate)}%)</span><b>₹${money(tax)}</b></div>`:`<div class="sumrow"><span>GST (${money(taxRate)}%)</span><b>₹${money(tax)}</b></div>`;
let total=taxable+tax;
let trs=rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.d)||'-'}</td><td class="num">${x.q}</td><td class="num">₹${money(x.r)}</td><td class="num">₹${money(x.q*x.r)}</td></tr>`).join('');
$('invoice').innerHTML=`<div class="inv-head"><div><div class="brand">${esc($('company').value)||'Business Name'}</div><div class="small">${esc($('companyAddress').value)}<br>${esc($('companyPhone').value)}<br>${esc($('companyEmail').value)}<br>${$('companyGSTIN').value?'GSTIN: '+esc($('companyGSTIN').value):''}</div></div><div class="right"><h3>INVOICE</h3><b>${esc($('invoiceNo').value)}</b><div class="small">${$('invoiceDate').value}</div><span class="badge">${$('status').value}</span></div></div>
<div class="parties"><div><div class="label">Bill To</div><b>${esc($('customer').value)||'Customer Name'}</b><div class="small">${esc($('customerAddress').value)}<br>${esc($('customerPhone').value)}<br>${$('customerGSTIN').value?'GSTIN: '+esc($('customerGSTIN').value):''}</div></div><div><div class="label">Payment</div><b>${$('status').value}</b><div class="small">Invoice No: ${esc($('invoiceNo').value)}<br>Date: ${$('invoiceDate').value}</div></div></div>
<table class="inv-table"><thead><tr><th>#</th><th>Description</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>${trs}</tbody></table>
<div class="summary"><div class="sumrow"><span>Subtotal</span><b>₹${money(sub)}</b></div><div class="sumrow"><span>Discount</span><b>- ₹${money(disc)}</b></div><div class="sumrow"><span>Taxable Amount</span><b>₹${money(taxable)}</b></div>${taxHTML}<div class="sumrow total"><span>Grand Total</span><b>₹${money(total)}</b></div></div>
<div class="footer-note"><b>Notes / Terms</b><br>${esc($('notes').value)||'Thank you for your business.'}<br><br>This invoice is computer generated.</div>`;
}
function gstCalc(){let a=+$('gstAmount').value||0,r=+$('gstRate').value||0,g=a*r/100;$('gstResult').innerHTML=`GST: ₹${money(g)}<br>Total: ₹${money(a+g)}`}
function percentCalc(){let v=+$('percentValue').value||0,r=+$('percentRate').value||0;$('percentResult').textContent=`${r}% of ${v} = ${money(v*r/100)}`}
function ageCalc(){if(!$('birth').value)return;$('ageResult').textContent='Age: '+diffAge(new Date($('birth').value),new Date())}
function diffAge(d,n){let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth(),day=n.getDate()-d.getDate();if(day<0)m--;if(m<0){y--;m+=12}return `${y} years, ${m} months`}
function dateCalc(){let a=new Date($('date1').value),b=new Date($('date2').value);if(isNaN(a)||isNaN(b))return;$('dateResult').textContent=Math.abs(Math.round((b-a)/86400000))+' days'}
function unitCalc(){let v=+$('unitValue').value||0,t=$('unitType').value,m={kmmi:v*.621371,mikm:v*1.609344,kgp:v*2.20462,pkg:v*.453592,cf:v*9/5+32,fc:(v-32)*5/9,mft:v*3.28084,ftm:v*.3048};$('unitResult').textContent=m[t].toFixed(4)}
function passwordCalc(){let c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';if($('symbols').value==='Yes')c+='!@#$%^&*_-+=';let s='';for(let i=0;i<+$('passLength').value;i++)s+=c[Math.floor(Math.random()*c.length)];$('passResult').textContent=s}
function textTool(t){let e=$('textInput'),s=e.value;if(t==='upper')s=s.toUpperCase();if(t==='lower')s=s.toLowerCase();if(t==='title')s=s.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase());if(t==='clean')s=s.replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n').trim();e.value=s;$('textResult').textContent=`${s.length} characters • ${s.trim()?s.trim().split(/\s+/).length:0} words`}
const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function nwords(n){if(n===0)return'Zero';if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+' '+ones[n%10];if(n<1000)return ones[Math.floor(n/100)]+' Hundred '+nwords(n%100);if(n<100000)return nwords(Math.floor(n/1000))+' Thousand '+nwords(n%1000);if(n<10000000)return nwords(Math.floor(n/100000))+' Lakh '+nwords(n%100000);return nwords(Math.floor(n/10000000))+' Crore '+nwords(n%10000000)}
function wordsCalc(){let n=Math.floor(+$('numberInput').value||0);$('numberResult').textContent=n<1000000000?nwords(n):'Enter number below 1 billion'}
function storageCalc(){let v=+$('storageValue').value||0,u=$('storageUnit').value,k={KB:1/1024,MB:1,GB:1024,TB:1048576}[u],mb=v*k;$('storageResult').textContent=`${money(mb)} MB • ${money(mb/1024)} GB • ${money(mb/1048576)} TB`}
function randomCalc(){let a=Math.ceil(+$('randomMin').value),b=Math.floor(+$('randomMax').value);$('randomResult').textContent=Math.floor(Math.random()*(b-a+1))+a}
function openWA(){let p=$('waPhone').value.replace(/\D/g,''),m=encodeURIComponent($('waMessage').value);if(p&&m)window.open('https://wa.me/'+p+'?text='+m,'_blank')}
function downloadInvoice(){let blob=new Blob([document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=($('invoiceNo').value||'invoice')+'.html';a.click();URL.revokeObjectURL(a.href)}
$('logoData').value='';$('signatureData').value='';$('invoiceNo').value='INV-'+new Date().getFullYear()+'-001';$('invoiceDate').value=new Date().toISOString().slice(0,10);renderRows();updateInvoicePreview();
</script>
<script>
